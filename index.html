<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<head>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            outline: none;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
        #status {
            position: fixed;
            bottom: 8px;
            left: 8px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            z-index: 8;
            opacity: 1;
            transition: opacity 0.2s;
        }
        #status.connected {
            color: #4ade80;
        }
        #status.disconnected {
            color: #f87171;
        }
        #status.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body style="margin:0; background:#111; touch-action:none; overflow:hidden; height:100vh">
    <div id="status" class="disconnected">Connecting...</div>
    <button id="fs" style="position:fixed;top:8px;right:8px;z-index:9">Set fullscreen and start drawing</button>
    <script>
        const ws = new WebSocket(`ws://${location.host}/ws`);
        let drawing = false;
        let isFullscreen = false;
        let isConnected = false;

        const statusEl = document.getElementById('status');

        const updateStatus = (connected) => {
            isConnected = connected;
            if (connected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'connected';
            } else {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'disconnected';
            }
        };

        const updateStatusVisibility = () => {
            if (isFullscreen) {
                statusEl.classList.add('hidden');
            } else {
                statusEl.classList.remove('hidden');
            }
        };

        ws.onopen = () => {
            updateStatus(true);
            const sendSize = () => {
                if (ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'size', w: innerWidth, h: innerHeight }));
                }
            };
            sendSize();
            addEventListener('resize', sendSize);
        };

        ws.onclose = () => updateStatus(false);
        ws.onerror = () => updateStatus(false);

        const send = (type, e) => {
            if (ws.readyState !== 1 || !isFullscreen) return;
            
            const p = e.pointerType === 'pen' ? e.pressure : (type === 'hover' ? 0 : 0.5);
            try {
                ws.send(JSON.stringify({
                    type, x: e.clientX / innerWidth, y: e.clientY / innerHeight, p,
                    pen: e.pointerType === 'pen'
                }));
            } catch (err) {
                console.error('Failed to send:', err);
            }
        };

        const handleFullscreenChange = () => {
            const currentFullscreen = document.fullscreenElement !== null;
            
            if (currentFullscreen && !isFullscreen) {
                isFullscreen = true;
                fs.style.display = 'none';
                drawing = false;
                updateStatusVisibility();
            } else if (!currentFullscreen && isFullscreen) {
                isFullscreen = false;
                fs.style.display = 'block';
                drawing = false;
                updateStatusVisibility();
            }
        };

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('mousedown', e => e.preventDefault());

        addEventListener('pointerdown', e => { 
            if (!isFullscreen) return;
            drawing = true; 
            send('down', e); 
        });
        
        addEventListener('pointermove', e => {
            if (!isFullscreen) return;
            for (const c of (e.getCoalescedEvents?.() || [e])) {
                send(drawing ? 'move' : 'hover', c);
            }
        });
        
        addEventListener('pointerup', e => { 
            if (!isFullscreen) return;
            drawing = false; 
            send('up', e); 
        });
        
        addEventListener('pointercancel', e => { 
            if (!isFullscreen) return;
            drawing = false; 
            send('up', e); 
        });
        
        document.documentElement.addEventListener('pointerleave', e => {
            if (!isFullscreen) return;
            send('leave', e);
        });

        addEventListener('contextmenu', e => e.preventDefault());
        
        fs.onclick = () => document.documentElement.requestFullscreen().catch(err => {
            console.error('Fullscreen request failed:', err);
        });
    </script>
